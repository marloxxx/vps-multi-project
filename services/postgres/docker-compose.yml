# PostgreSQL – backend network + 127.0.0.1:5432 for local/VPS tools (no Traefik)
# Data under /opt/volumes/postgres or compose-relative ./data
#
# Operate via scripts/stack-manage.sh (start|stop|restart|health postgres): it runs
# `docker compose -f this-file --env-file $STACK_ROOT/.env`, so POSTGRES_* and
# POSTGRES_DATA_DIR live in the stack root .env, not beside this file.
# If you run `docker compose` by hand from services/postgres, pass the same file:
#   docker compose --env-file /opt/stack/.env up -d
# ${POSTGRES_*:-postgres} defaults avoid blank Compose substitution when no env is
# passed (e.g. ad-hoc compose config); they do not replace your stack .env when using stack-manage.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    # Default Docker /dev/shm (64MiB) is too small for parallel queries and many
    # backends; Postgres then logs "could not resize shared memory segment … No
    # space left on device" (shm full, not necessarily disk). Raise if errors persist
    # after verifying HostConfig.ShmSize on the running container (must recreate).
    shm_size: "1gb"
    # Default 10s stop → Docker SIGKILL can interrupt checkpoint; give Postgres time to exit cleanly.
    stop_grace_period: 90s
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Do not mark unhealthy (and trigger restarts) while crash recovery is still running.
      start_period: 120s

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR:-./data}

networks:
  backend:
    external: true
