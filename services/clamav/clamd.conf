# Image defaults (the init script waits for the unix socket) plus raised size limits.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Default StreamMaxLength is 25M; uploads are allowed up to 100M, so INSTREAM must accept that.
StreamMaxLength 100M
MaxFileSize 100M
