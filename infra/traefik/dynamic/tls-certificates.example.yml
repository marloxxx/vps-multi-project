# Example dynamic TLS for Traefik file provider (not enabled in stock traefik.yml).
# Copy-on-server layout + compose mounts: docs/TRAEFIK.md → “Example: host layout /opt/ssl/ptsi/”.
#
# Host PEM dir (e.g. /opt/ssl/ptsi/certs): fullchain.pem (leaf + intermediates), key.pem (chmod 600).

tls:
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/key.pem
