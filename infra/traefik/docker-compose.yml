# Traefik reverse proxy – attach all public apps to network "proxy"
# Load root .env from repo root: docker compose --env-file ../../.env up -d
#
# ACME resolver stays registered so older app compose files that still set
# tls.certresolver=letsencrypt keep routing. Stack services use file PEM
# (tls=true only). Strip the certresolver label from apps when you can.

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./acme.json:/letsencrypt/acme.json
    networks:
      - proxy

networks:
  proxy:
    external: true
