# Traefik reverse proxy – attach all public apps to network "proxy"
# Load root .env from repo root: docker compose --env-file ../../.env up -d
#
# TLS default: file-loaded PEM (see docs/TRAEFIK.md). Do not pass
# --certificatesresolvers.letsencrypt.* here — that registers ACME and any
# leftover tls.certresolver=letsencrypt label will hit Let's Encrypt.

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./acme.json:/letsencrypt/acme.json
    networks:
      - proxy

networks:
  proxy:
    external: true
