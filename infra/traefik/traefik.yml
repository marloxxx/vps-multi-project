# Traefik static configuration (Docker provider via compose labels).
# TLS default: file-loaded PEM via providers.file on the server (docs/TRAEFIK.md).
# Do not set certificatesResolvers.letsencrypt unless a router explicitly needs ACME.
#
# Layered Traefik (edge A → this instance B): `web` (:80) is plain HTTP (no forced HTTPS redirect).
# HTTPS remains on `websecure` (:443) for routers that use TLS. For east-west checks without TLS,
# use entrypoint `internal` (:8080) if you publish it only on the VPC interface.

api:
  dashboard: true
  insecure: false

# Liveness for upstream checks: GET /ping is served on this entrypoint only (not on web/websecure).
# Matches :8080 entrypoint `internal` (see header comment).
ping:
  entryPoint: internal

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  # Plain HTTP for private / east-west only (no redirect). Publish 8080 only on the VPC interface.
  internal:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

# Optional Let's Encrypt — leave commented. Enabling this plus a router
# tls.certresolver=letsencrypt label will ACME that Host (needs public DNS).
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: set-via-compose-if-you-enable-this
#       storage: /letsencrypt/acme.json
#       httpChallenge:
#         entryPoint: web

log:
  level: INFO

accessLog: {}
