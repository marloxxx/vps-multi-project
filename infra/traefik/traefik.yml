# Traefik static configuration (Docker provider via compose labels; optional file provider)
# Docs: https://doc.traefik.io/traefik/
#
# Layered Traefik (edge A → this instance B): keep public :80 → :443 redirect on `web`, but
# never send upstream checks from A to B on `web` with only the backend IP — that hits this
# redirect and becomes HTTPS to an IP (TLS name mismatch). Use entrypoint `internal` (:8080)
# from A instead, and add `internal` to the same routers as `websecure` (preserve Host header).

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Plain HTTP for private / east-west only (no redirect). Publish 8080 only on the VPC interface.
  internal:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  letsencrypt:
    acme:
      # email set via compose command from .env (ACME_EMAIL)
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
